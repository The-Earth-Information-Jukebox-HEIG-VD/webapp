# Nginx configuration for Earth Information Jukebox SPA
# - Serves static files from /usr/share/nginx/html
# - SPA routing: all non-file requests → index.html
# - API proxy: /api/* → backend service

# Keep connections to the backend open between requests (one TCP handshake
# per chunk otherwise). Needs proxy_http_version 1.1 and an empty Connection.
upstream backend_api {
    server backend:8000;
    keepalive 8;
}

# "Connection: upgrade" only when the browser asks for a WebSocket; for
# ordinary requests an empty value, so the upstream connection is reused.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    # Alpine resolves "localhost" to [::1] first: without this the healthchecks fail
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/xml+rss image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy to backend service
    # In Docker Compose, 'backend' resolves to the backend container
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;

        # The selected zone travels in the request body. nginx's default limit
        # (1 MB) rejects large zones (the Pacific is ~3 MB as a point list)
        # with a 413 before the backend sees them.
        client_max_body_size 16m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed for future features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts for long-running sonification requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Datasets from the jukebox-data Docker volume (mounted read-only, see
    # deployment/docker-compose.yml). The webapp reads the monthly .npy maps
    # directly: JSON directory listings + HTTP Range requests for the rows of
    # the selected zone. No gzip here: compressed responses ignore Range.
    location /data/ {
        alias /usr/share/nginx/data/;
        autoindex on;
        autoindex_format json;
        gzip off;
        types { application/octet-stream npy; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;

        # Hide the volume's init marker
        location ~ /\. {
            deny all;
        }
    }

    # Cache static assets with long expiry
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
