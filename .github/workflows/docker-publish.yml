# Build and publish Docker image to GitHub Container Registry
# Triggers on version tags (v*) and fb-docker-support branch for testing
name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'fb-docker-support'  # For testing the workflow
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to make the GitHub release for (e.g. v1.4.0)
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # a manual run only (re)creates the release of an existing tag: no image rebuild
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with version (v1.0.0 → 1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor (v1.0.0 → 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with 'latest' for default branch tags
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # Tag with branch name for testing
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api

  # A tag only builds the image; the GitHub release (the "Releases" box) is made here,
  # once the image is published
  release:
    needs: build
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release (notes from the commits since the previous tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
