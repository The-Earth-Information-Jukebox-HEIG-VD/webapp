# Lint, test and build on every push to main and every pull request
# (Docker images are published by docker-publish.yml)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # same as the Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes jsx-a11y)
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build (type check + Vite build)
        run: npm run build
